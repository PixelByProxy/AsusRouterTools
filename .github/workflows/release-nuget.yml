name: Release Nuget

on:
  workflow_dispatch:

jobs:
  release:

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write # required for nuget.org trusted publishing (OIDC)

    steps:
      - uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download Artifact
        uses: bettermarks/action-artifact-download@0.3.0
        with:
          token: ${{secrets.GITHUB_TOKEN}}
          artifact_name: NugetPreRelease
          rename: nuget.zip

      - name: Extract Nuget
        uses: montudor/action-zip@v1
        with:
          args: unzip -qq nuget.zip -d packages

      - name: Display Files
        run: ls -R

      # Exchanges the GitHub OIDC token for a short-lived (1 hour) nuget.org API key.
      # Requires a Trusted Publishing policy on nuget.org for this repo + release-nuget.yml.
      - name: Nuget.org Login
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{secrets.NUGET_USER}}

      - name: Nuget.org Push Packages
        run: dotnet nuget push "packages/*.nupkg" --api-key ${{steps.nuget-login.outputs.NUGET_API_KEY}} --source "https://api.nuget.org/v3/index.json" --skip-duplicate

      - name: Github Push Packages
        run: dotnet nuget push "packages/*.nupkg" --api-key ${{secrets.GITHUB_TOKEN}} --source "https://nuget.pkg.github.com/PixelByProxy/index.json" --skip-duplicate
